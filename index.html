 if(Array.isArray(o.accts)){const a=o.accts.filter(a=>a&&typeof a=="object").map((a,i)=>({id:num(a.id,i+1),name:String(a.name||"Account").slice(0,30),cur:CUR.includes(a.cur)?a.cur:"CAD",type:a.type=="credit"?"credit":"cash",bal:num(a.bal),limit:Math.max(0,num(a.limit))}));if(a.length)s.accts=a}

  h+=`<section class="hero"><div class="big">${m0(inv)}</div><p class="${g>=0?"gain":"loss"}">${g>=0?"Up":"Down"} ${m0(Math.abs(g))}${invCost?" ("+(g/invCost*100).toFixed(1)+"%)":""} since you bought.</p></section>
  <p class="mute" style="font-size:14px">${liveOk()?"Prices update when you add a holding and each time you tap Refresh. Pick the market when you add a holding. Each one shows when its price last updated and from where.":"Prices don't update by themselves. Enter the latest price on each holding to refresh your totals."}</p>`;
  h+=S.inv.length?S.inv.map(x=>{const v=x.qty*x.price,gl=v-x.qty*x.cost;return`<div class="card"><div class="top"><b>${esc(baseSym(x.sym))}${isTSX(x.sym)?` <small>${mktOf(x.sym)=="TSXV"?"TSX-V":"TSX"}</small>`:""}</b><span>${x.qty} units, bought at ${fm(x.cost,x.cur,2)}</span></div><div class="top"><span>${fm(v,x.cur,2)}</span><span class="${gl>=0?"gain":"loss"}">${gl>=0?"+":""}${fm(gl,x.cur,2)}</span></div>${stLine(x)}<div class="bud"><label for="p${x.id}">Current price (${x.cur})</label><input id="p${x.id}" type="number" inputmode="decimal" min="0" step="any" value="${x.price}" onchange="setPrice(${x.id},this.value)"><button class="x" aria-label="Remove holding" onclick="delInv(${x.id})">×</button></div><div class="bud"><label for="m${x.id}">Market</label><select id="m${x.id}" style="width:auto" onchange="setMkt(${x.id},this.value)">${MK.map(([k,l])=>`<option value="${k}" ${mktOf(x.sym)==k?"selected":""}>${l}</option>`).join("")}</select></div></div>`}).join(""):`<div class="empty">No holdings yet. Add your first below.</div>`;
  h+=`<div class="card"><h3>Add a holding</h3><div class="g2"><input id="is" placeholder="Symbol, e.g. RY or XEQT" maxlength="16" autocapitalize="characters" autocorrect="off"><select id="im" aria-label="Market" onchange="$('#ic').value=this.value=='US'?'USD':'CAD'">${MK.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select><select id="ic" aria-label="Currency">${CUR.map(c=>`<option>${c}</option>`).join("")}</select><input id="iq" type="number" inputmode="decimal" placeholder="Units" step="any"><input id="ib" type="number" inputmode="decimal" placeholder="Cost per unit" step="any"><input id="ip" type="number" inputmode="decimal" placeholder="Current price (optional)" step="any"></div><button class="btn" onclick="addInv()">Add holding</button></div>`;}
 }else{
  h+=S.accts.map(a=>`<div class="card"><div class="top"><b>${esc(a.name)} <small>${a.cur}, ${a.type=="credit"?"credit card":"cash"}</small></b><button class="x" aria-label="Delete account" onclick="delAcct(${a.id})">×</button></div><div class="bud"><label for="bal${a.id}">${a.type=="credit"?"Balance owed":"Balance"}</label><input id="bal${a.id}" type="number" inputmode="decimal" step="any" value="${a.bal.toFixed(2)}" onchange="setBal(${a.id},this.value)"></div><small>${a.cur!="CAD"?"About "+m0(cv(a.bal,a.cur))+". ":""}${a.type=="credit"&&a.limit?"Limit "+fm(a.limit,a.cur,0)+", "+Math.round(a.bal/a.limit*100)+"% used.":""}</small></div>`).join("");
  h+=`<div class="card"><h3>Add an account</h3><input id="an" placeholder="Name, e.g. Euro savings" maxlength="30"><div class="g2"><select id="acu">${CUR.map(c=>`<option>${c}</option>`).join("")}</select><select id="aty"><option value="cash">Cash account</option><option value="credit">Credit card</option></select><input id="ab" type="number" inputmode="decimal" step="any" placeholder="Balance or owed"><input id="al" type="number" inputmode="decimal" placeholder="Card limit"></div><button class="btn" onclick="addAcct()">Add account</button></div>
  ${privCard()}<div class="card"><h3>Exchange rates</h3><p class="mute" style="margin:0 0 6px;font-size:14px">Value of 1 unit in CAD. ${ratesNote()}</p>${CUR.filter(c=>c!="CAD").map(c=>`<div class="bud"><label for="r${c}">1 ${c} in CAD</label><input id="r${c}" type="number" step="any" min="0" value="${S.rates[c]}" onchange="setRate('${c}',this.value)"></div>`).join("")}</div>`;
 }
 const I={over:"M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10",spend:"M4 20V10M10 20V4M16 20v-7M22 20H2",inv:"M3 17l6-6 4 4 8-8M15 7h6v6",acc:"M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2",fc:"M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z"};
 const nb=(k,l)=>`<button ${tab==k?'aria-current="page"':""} onclick="setTab('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${I[k]}"/></svg>${l}</button>`;
 h+=`<nav><div class="in">${nb("over","Overview")}${nb("spend","Spending")}${nb("fc","Forecast")}${nb("inv","Wealth")}${nb("acc","Accounts")}</div></nav>`;
 $("#app").innerHTML=h;document.body.classList.toggle("priv",priv);
}
function shift(k){let[y,m]=ym.split("-").map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+"-"+p2(m);render()}
function setTab(t){tab=t;render()}
function setBud(c,v){S.budgets[c]=Math.max(0,parseFloat(v)||0);save();render()}
function setBal(id,v){acc(id).bal=parseFloat(v)||0;save();render()}
function setRate(c,v){const r=parseFloat(v);if(r>0){S.rates[c]=r;S.ratesAt=ld(new Date())}save();render()}
function setPrice(id,v){const x=S.inv.find(i=>i.id==id);if(x)x.price=Math.max(0,parseFloat(v)||0);save();render()}
function delInv(id){S.inv=S.inv.filter(i=>i.id!=id);save();render()}
const MK=[["TSX","Canada (TSX)"],["TSXV","Canada (TSX-V)"],["US","US"]];
function stLine(x){const st=x.st,tm=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),day=t=>ld(new Date(t))==ld(new Date())?tm(t):new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
 if(LIVE.busy&&LIVE.prog.includes(x.sym))return`<p class="mute" style="margin:0 0 6px;font-size:14px">Updating price...</p>`;
 if(!st)return`<p class="mute" style="margin:0 0 6px;font-size:14px">Price not updated yet. <button class="lnk" onclick="refreshLive(true,[${x.id}])">Update now</button></p>`;
 if(st.ok)return`<p style="margin:0 0 6px;font-size:14px"><span class="ok">●</span> <span class="mute">Updated ${day(st.t)} via ${esc(st.via)}${st.via=="Google"?", may be delayed":st.via=="US listing"?", converted to CAD":""}</span></p>`;
 return`<p class="warn" style="margin:0 0 6px;font-size:14px">${esc(st.msg)} <button class="lnk" onclick="refreshLive(true,[${x.id}])">Try again</button></p>`}
function setMkt(id,m){const h=S.inv.find(x=>x.id==id);if(!h)return;h.sym=normSym(baseSym(h.sym),m);h.cur=m=="US"?"USD":"CAD";h.st=null;h.at=0;save();render();refreshLive(true,[id])}
function addInv(){const s=$("#is").value.trim(),q=parseFloat($("#iq").value),b=parseFloat($("#ib").value),p=parseFloat($("#ip").value);
 if(!s||!(q>0)){note="Enter a symbol and the number of units.";return render()}
 const sym=normSym(s,$("#im").value),id=Date.now();S.inv.push({id,sym,qty:q,cost:b||0,price:p||b||0,cur:isTSX(sym)?"CAD":$("#ic").value,st:null});save();note=`Added ${baseSym(sym)}. Getting its live price...`;render();refreshLive(true,[id])}
function addAcct(){const n=$("#an").value.trim();if(!n){note="Give the account a name.";return render()}
 S.accts.push({id:Date.now(),name:n,cur:$("#acu").value,type:$("#aty").value,bal:parseFloat($("#ab").value)||0,limit:parseFloat($("#al").value)||0});save();render()}
function delAcct(id){if(S.accts.length<2)note="Keep at least one account.";else if(S.tx.some(t=>t.acct==id))note="Delete this account's expenses first.";else{S.accts=S.accts.filter(a=>a.id!=id);save()}render()}
function openSheet(){
 $("#ac").innerHTML=S.accts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.cur})</option>`).join("");
 $("#c").innerHTML=Object.keys(BUD).map(c=>`<option>${c}</option>`).join("");
 $("#a").value="";$("#n").value="";$("#r").value="";$("#d").value=ld(new Date());touched=false;rcpt=null;$("#sm").textContent="";$("#rf").value="";
 $("#sheet").classList.add("open");setTimeout(()=>$("#a").focus(),50)}
function closeSheet(){$("#sheet").classList.remove("open")}
function addTx(){let amt=parseFloat($("#a").value);
 if(!(amt>0)){$("#a").style.borderColor="var(--red)";return $("#a").focus()}
 $("#a").style.borderColor="";
 const date=$("#d").value||ld(new Date()),a=acc($("#ac").value);if(rcpt&&rcpt.cur&&rcpt.cur!=a.cur&&Math.abs(rcpt.amt-amt)<.005)amt=+(amt*(S.rates[rcpt.cur]||1)/(S.rates[a.cur]||1)).toFixed(2);
 const k=date.slice(0,7),b4=alertList(k).map(x=>x[1]);S.tx.push({id:Date.now(),amt,acct:a.id,cat:$("#c").value,note:$("#n").value.trim(),date,rec:$("#r").value});
 a.bal+=a.type=="credit"?amt:-amt;save();const nw=alertList(k).find(x=>!b4.includes(x[1]));if(nw)note="Alert: "+nw[1];ym=k;tab="spend";closeSheet();render()}
function delTx(id){const t=S.tx.find(t=>t.id==id);if(!t)return;const a=acc(t.acct);a.bal+=a.type=="credit"?-t.amt:t.amt;S.tx=S.tx.filter(x=>x.id!=id);save();render()}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
async function exp(kind){if(!DL&&HOST)return;let rows;
 if(kind=="tx")rows=[["Date","Type","Frequency","Category","Group","Note","Account","Currency","Amount","Amount CAD"],...S.tx.map(t=>{const a=acc(t.acct);return[t.date,t.rec?"Recurring":"One-time",t.rec,t.cat,GRP[t.cat],t.note.replace(/^[=+\-@]/,"'$&"),a.name,a.cur,t.amt.toFixed(2),cv(t.amt,a.cur).toFixed(2)]})];
 else if(kind=="ast")rows=[["Name","Type","Currency","Purchase price","Purchase date","Current value","Running cost","Per","Cost per day CAD"],...S.assets.map(a=>[a.name.replace(/^[=+\-@]/,"'$&"),a.kind,a.cur,a.price,a.date,a.value,a.run,a.per,astCalc(a).perDay.toFixed(2)])];else rows=[["Symbol","Units","Cost per unit","Current price","Currency","Value","Gain or loss","Gain or loss %"],...S.inv.map(x=>{const v=x.qty*x.price,g=v-x.qty*x.cost;return[x.sym,x.qty,x.cost,x.price,x.cur,v.toFixed(2),g.toFixed(2),x.cost&&x.qty?(g/(x.qty*x.cost)*100).toFixed(1)+"%":""]})];
 const csv=rows.map(r=>r.map(q).join(",")).join("\r\n");
 const fn=({tx:"spending-",ast:"assets-"}[kind]||"investments-")+ld(new Date())+".csv";if(!DL)return saveLocal(fn,new Blob([csv],{type:"text/csv"}));
 try{await DL.save({filename:({tx:"spending-",ast:"assets-"}[kind]||"investments-")+ld(new Date())+".csv",data:new Blob([csv],{type:"text/csv"})})}catch(e){if(!e||e.code!="declined"){note="The download didn't save. Try again.";render()}}}
$("#n").addEventListener("input",e=>{if(touched)return;const g=guess(e.target.value);if(g)$("#c").value=g});
$("#c").addEventListener("change",()=>touched=true);
$("#sheet").addEventListener("click",e=>{if(e.target.id=="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&locked)unlock()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&PIN()){locked=true;render()}});
$("#rf").addEventListener("change",e=>scanReceipt(e.target.files[0]));if(!HOST)$("#scanb").hidden=false;
$("#ac").addEventListener("change",()=>{if(rcpt&&rcpt.cur){const a=acc($("#ac").value);$("#sm").textContent=rcpt.cur!=a.cur?`This receipt is in ${rcpt.cur}. It will be saved in ${a.cur} at your saved rate.`:""}});
load();locked=!!PIN();render();
$("#cq").addEventListener("keydown",e=>{if(e.key=="Enter")askAI()});
setTimeout(()=>brief(),1200);document.addEventListener("visibilitychange",()=>{if(!document.hidden)brief()});
document.addEventListener("pointermove",scrub);if(!HOST&&S.tdKey&&!locked)refreshLive();document.addEventListener("pointerdown",scrub);
try{window.claude&&claude.use("mcp").then(m=>{if(!m)return;MCP=m;render();refreshLive()}).catch(()=>{})}catch(e){}
setInterval(()=>{const t=document.activeElement&&document.activeElement.tagName;if(liveOk()&&!document.hidden&&!locked&&!/INPUT|SELECT/.test(t||"")&&!$("#sheet").classList.contains("open"))refreshLive()},9e5);
try{window.claude&&claude.use("sample").then(async x=>{if(!x)return;SAMT=x;render();const l=await x.limits().catch(()=>null);if(l&&l.images){SAM=x;$("#scanb").hidden=false}}).catch(()=>{})}catch(e){}
try{window.claude&&claude.use("downloads").then(d=>{DL=d;if(d)render()}).catch(()=>{})}catch(e){}
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
