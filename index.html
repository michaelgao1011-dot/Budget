<script>

const F={weekly:52/12,biweekly:26/12,semimonthly:2,monthly:1,quarterly:1/3,yearly:1/12};

const fresh=()=>({rates:{...RATE},accts:[{id:1,name:"Checking",cur:"CAD",type:"cash",bal:0,limit:0}],tx:[],inv:[],budgets:{...BUD},alertAt:80,income:0,ret:6,contrib:0,assets:[],estM:0,estW:0,hist:[],inc:[],pay:[],wg:{order:[],off:[]},by:0,gross:0,ver:4,ratesAt:"2026-09-16"});

function heal(o){let n=0;const s=fresh();if(!o||typeof o!=="object")return{s,n:1};
 const num=(v,d=0)=>Number.isFinite(+v)?+v:(n++,d);
 if(o.budgets&&typeof o.budgets=="object")for(const c in BUD)if(c in o.budgets)s.budgets[c]=Math.max(0,num(o.budgets[c],BUD[c]));

 s.rates.CAD=1;if(o.ver>=2&&/^\d{4}-\d{2}-\d{2}$/.test(o.ratesAt))s.ratesAt=o.ratesAt;if(+o.alertAt>=50&&+o.alertAt<=100)s.alertAt=Math.round(+o.alertAt);if(+o.income>=0)s.income=+o.income;if(+o.contrib>=0)s.contrib=+o.contrib;if(+o.ret>=-20&&+o.ret<=50)s.ret=+o.ret;
